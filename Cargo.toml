[package]
name = "browser"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
x11rb = "0.13"
winit = "0.29"
softbuffer = "0.4"
raw-window-handle = "0.6"
resvg = "0.48.1"
reqwest = { version = "0.13.2", features = ["json", "cookies", "gzip"]}
tokio = { version = "1", features = ["full"] }
bytes = "1.11.1"
deno_core = { path = "../deno/libs/core" }
url = "2.5.8"
deno_webidl = { path = "../deno/ext/webidl" }
deno_web = { path = "../deno/ext/web" }
percent-encoding = "2.3.2"
psl = "2"
ab_glyph = "0.2.32"
deno_fetch = { path = "../deno/ext/fetch" }
deno_net = { path = "../deno/ext/net" }
deno_permissions = { path = "../deno/runtime/permissions" }
rustls = { version = "=0.23.40", default-features = false, features = ["logging", "std", "tls12", "aws_lc_rs"] }
sys_traits = { version = "=0.1.28", features = ["libc", "real"] }
deno_crypto = { path = "../deno/ext/crypto" }
image = "0.25.10"
fixedbitset = "0.5.7"
half = "2.7.1"
deno_error = "=0.7.1"
palette = "0.7.6"
serde = { version = "1", features = ["derive"] }
